version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: epm_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epm_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseProjectDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sql_data:
